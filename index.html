<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily News</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Theme colour — adapts to colour scheme, matches header -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">

  <!-- iOS / Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily News">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <!-- Open Graph / share preview -->
  <meta property="og:title" content="Daily News">
  <meta property="og:description" content="Top news topics from 2400+ sources, clustered daily.">
  <meta property="og:image" content="icons/icon-512.png">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="#" class="site-title">Daily News</a>
      <nav class="date-nav" aria-label="Date navigation">
        <a id="nav-prev" href="#" aria-label="Previous day">&#8592; Prev</a>
        <span id="nav-date"></span>
        <a id="nav-next" href="#" aria-label="Next day">Next &#8594;</a>
      </nav>
    </div>
  </header>

  <main id="content">
    <p class="status">Loading&hellip;</p>
  </main>

  <footer>
    <div class="footer-inner">
      <span id="footer-meta"></span>
      <span class="footer-links">
        Powered by <a href="https://www.filipa.ai/en/" target="_blank" rel="noopener noreferrer">filipa.ai</a>
        &nbsp;&middot;&nbsp;
        <a href="imprint.html">Imprint</a>
      </span>
    </div>
  </footer>

  <script type="module" src="assets/app.js"></script>

  <!-- Service worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
