<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Blue background -->
  <rect width="512" height="512" fill="#0057d8"/>

  <!-- White newspaper body -->
  <rect x="88" y="88" width="336" height="336" rx="20" fill="white"/>

  <!-- Blue headline bar -->
  <rect x="116" y="120" width="280" height="44" rx="7" fill="#0057d8"/>

  <!-- Subheadline -->
  <rect x="116" y="182" width="170" height="16" rx="5" fill="#b3cbef"/>

  <!-- Article text lines (3 rows) -->
  <rect x="116" y="214" width="280" height="11" rx="4" fill="#dce8f8"/>
  <rect x="116" y="233" width="265" height="11" rx="4" fill="#dce8f8"/>
  <rect x="116" y="252" width="280" height="11" rx="4" fill="#dce8f8"/>
  <rect x="116" y="271" width="200" height="11" rx="4" fill="#dce8f8"/>

  <!-- Horizontal rule -->
  <rect x="116" y="299" width="280" height="2" fill="#d0dff4"/>

  <!-- Second headline -->
  <rect x="116" y="317" width="195" height="16" rx="5" fill="#b3cbef"/>

  <!-- Second article text lines -->
  <rect x="116" y="349" width="280" height="11" rx="4" fill="#dce8f8"/>
  <rect x="116" y="368" width="240" height="11" rx="4" fill="#dce8f8"/>
  <rect x="116" y="387" width="280" height="11" rx="4" fill="#dce8f8"/>

  <!-- Fold dog-ear -->
  <polygon points="336,88 424,88 424,152" fill="#c5d9f5"/>
  <polygon points="336,88 336,152 424,152" fill="white" opacity="0.35"/>
</svg>
